name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Re-run tests so deploy.yml is self-contained and the dependency is explicit.
  # (Avoids relying on workflow_run timing across separate workflow files.)
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Pi (prod)
    runs-on: ubuntu-latest
    needs: [unit, e2e]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        # Output: dist/

      - name: Bundle server
        run: |
          npx esbuild server/index.js \
            --bundle \
            --platform=node \
            --target=node20 \
            --outfile=dist/server.js \
            --external:better-sqlite3
        # better-sqlite3 is a native module — must be installed on the Pi.
        # All other server deps are inlined into dist/server.js.

      - name: Set up SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/rpi
          echo "${{ secrets.RPI_SSH_KEY }}" > ~/.ssh/rpi
          ssh-keyscan -H "${{ secrets.RPI_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload server bundle
        run: |
          scp -i ~/.ssh/rpi \
            dist/server.js \
            ${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }}:/opt/prod/gamebacklog/server.js

      - name: Upload frontend assets
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/rpi" \
            dist/ \
            ${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }}:/opt/prod/gamebacklog/dist/

      - name: Restart service
        run: |
          ssh -i ~/.ssh/rpi \
            ${{ secrets.RPI_USER }}@${{ secrets.RPI_HOST }} \
            "sudo systemctl restart gamebacklog-prod"
